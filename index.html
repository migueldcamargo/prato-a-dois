<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="O cardápio do casal: os pratos que vocês já fizeram ou pediram e jogos rápidos para decidir o que comer.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prato a Dois">
<meta name="format-detection" content="telephone=no">
<title>Prato a Dois</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="logica.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
/* Layout: uma coluna mobile (360–430 px), capa de restaurante, abas que grudam no topo, painéis que sobem de baixo. */
:root{
  --red:#EA1D2C; --red-dark:#C2111E; --red-soft:#FDECEE;
  --ink:#3E3E3E; --ink-strong:#1E1E1E; --muted:#717171; --line:#EEEEEE; --soft:#F6F5F5;
  --bg:#FFFFFF; --star:#FCBB00; --green:#1F8A4C; --green-soft:#E7F5EC;
  --opt-a:#2F6FEB; --opt-b:#E8790C; --opt-ab:#7A5AF8;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --nav-h:60px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.38}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html.locked,html.locked body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:disabled{cursor:default;opacity:.5}
input{font:inherit;color:inherit}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
h1,h2,h3{margin:0;color:var(--ink-strong);text-wrap:balance}
p{margin:0}
a{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.ic{flex-shrink:0;display:block}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-top:var(--sat)}
#statusbg{position:fixed;top:0;left:0;right:0;height:var(--sat);background:#fff;z-index:45}
#view{padding-bottom:calc(var(--nav-h) + 96px + var(--sab))}
#view.noNav{padding-bottom:calc(32px + var(--sab))}

/* Aviso para girar o celular */
.rotate{display:none;position:fixed;inset:0;z-index:2000;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.rotate b{font-size:20px;color:var(--ink-strong)}
.rotate .ic{color:var(--red);animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse){
  .rotate{display:flex}
}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .1s, background .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn-red{background:var(--red);color:#fff}
.btn-red:active{background:var(--red-dark)}
.btn-ghost{background:#fff;border-color:#DCDCDC;color:var(--ink)}
.btn-soft{background:var(--red-soft);color:var(--red)}
.btn-danger{background:#fff;border-color:#F3B6BB;color:var(--red)}
.btn-lg{width:100%;min-height:52px;font-size:16px;border-radius:12px}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn-text{color:var(--red);font-weight:600;min-height:44px;padding:0 4px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icon-btn:active{background:var(--soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spin .ic{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Campos */
.lbl{display:block;font-weight:700;color:var(--ink-strong);margin-bottom:8px;font-size:15px}
.lbl small{font-weight:400;color:var(--muted);margin-left:4px;font-size:13px}
.lbl-sm{font-size:13px;font-weight:600;margin:12px 0 6px}
.inp{width:100%;min-height:48px;border:1px solid #DCDCDC;border-radius:10px;padding:0 14px;font-size:16px;background:#fff;outline:none}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(234,29,44,.12)}
.inp-sm{min-height:40px;font-size:16px;padding:0 10px}
.inp-code{font-size:28px;letter-spacing:.35em;text-align:center;text-transform:uppercase;font-weight:800;font-variant-numeric:tabular-nums;min-height:64px}
.err{color:var(--red);font-size:13px;margin-top:6px}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.fld{padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.fld:last-child{border-bottom:0;margin-bottom:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-3{grid-template-columns:1fr 1fr 1fr}
.seg-b{min-height:48px;border:1px solid #DCDCDC;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;padding:0 8px;background:#fff;text-align:center;line-height:1.15}
.seg-b[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.seg-sm .seg-b{min-height:44px;font-size:14px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #DCDCDC;background:#fff;font-size:14px;font-weight:500}
.chip-sel{min-height:40px}
.chip-sel[aria-pressed="true"]{background:var(--ink-strong);border-color:var(--ink-strong);color:#fff}
.chip-add{border-style:dashed;color:var(--red);border-color:#F0A6AC}
.chip-sug{min-height:34px;background:var(--soft);border-color:transparent;font-size:13px}
.chip-static{min-height:28px;padding:0 10px;font-size:13px;background:var(--soft);border-color:transparent}
.chip-quiz{min-height:28px;padding:0 10px;font-size:13px;background:#FFF6DB;border-color:transparent;color:#7A5A00}
.newcat{display:flex;gap:6px;align-items:center;flex:1 1 220px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugs:empty{display:none}

/* Selos e papéis */
.orig-home{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);padding:2px 8px;border-radius:6px}
.orig-rest{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.role{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.role-dono{background:var(--red-soft);color:var(--red)}
.role-editor{background:var(--green-soft);color:var(--green)}
.role-pendente{background:#FFF6DB;color:#8A6500}

/* Estrelas */
.stars{position:relative;display:inline-flex;vertical-align:middle}
.st-base{display:flex;color:#DEDEDE}
.st-top{position:absolute;left:0;top:0;bottom:0;display:flex;overflow:hidden;color:var(--star)}
.rate{display:flex;gap:2px}
.rstar{width:44px;height:44px;display:grid;place-items:center;color:#D8D8D8;border-radius:8px;transition:transform .12s}
.rstar.on{color:var(--star)}
.rstar:active{transform:scale(.88)}

/* Abertura, erro, primeiro acesso */
.center-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center}
.loader{width:36px;height:36px;border-radius:50%;border:3px solid var(--red-soft);border-top-color:var(--red);animation:spin .8s linear infinite}
.onb{padding:40px 24px 32px;display:flex;flex-direction:column;gap:20px;min-height:90vh;justify-content:center}
.onb-art{display:flex;justify-content:center}
.onb-title{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.01em}
.onb-sub{text-align:center;color:var(--muted);font-size:16px;max-width:32ch;margin:0 auto}
.onb-form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.onb-note{font-size:13px;color:var(--muted);text-align:center}

/* Início (Meus cardápios) */
.home{padding:0 16px}
.home-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--red);font-size:18px;letter-spacing:-.01em}
.home-hello{padding:18px 0 16px}
.home-hello h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.home-hello p{color:var(--muted);margin-top:4px;font-size:16px}
.home-actions{display:grid;gap:10px}
.hact{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid #E4E4E4;background:#fff;min-height:64px;width:100%}
.hact b{display:block;font-size:16px;color:var(--ink-strong)}
.hact .hact-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);flex-shrink:0}
.hact-red{background:var(--red);border-color:var(--red)}
.hact-red b{color:#fff}
.hact-red .hact-ic{background:rgba(255,255,255,.18);color:#fff}
.install-chip{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;background:#EEF3FE;color:#24448F;font-size:14px;font-weight:600;text-align:left}
.install-chip span{flex:1}
.h2{font-size:18px;font-weight:800;margin:28px 0 8px}
.mylist{display:flex;flex-direction:column}
.myitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:64px;width:100%}
.my-logo{width:44px;height:44px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0}
.my-info{flex:1;min-width:0}
.my-info b{display:block;color:var(--ink-strong);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.my-info small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.my-badge{font-size:12px;font-weight:700;color:#fff;background:var(--red);padding:2px 7px;border-radius:999px;white-space:nowrap}
.empty-sm{padding:20px 0;color:var(--muted)}
.link-btn{display:block;margin:24px auto 0;color:var(--muted);font-size:15px;font-weight:600;min-height:44px;padding:0 16px}

/* Avisos */
.banner{display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:12px 14px;border-radius:12px;font-size:14px;width:calc(100% - 32px);text-align:left}
.banner .grow{flex:1}
.banner .btn-sm{flex-shrink:0}
.banner-warn{background:#FFF6DB;color:#6B4E00}
.banner-info{background:#EEF3FE;color:#24448F}
.banner-red{background:var(--red-soft);color:#9B0F1A}

/* Capa do cardápio */
.cover{position:relative}
.cover-banner{height:120px;background:linear-gradient(135deg,#EA1D2C 0%,#C8101E 100%);position:relative;overflow:hidden}
.cover-banner span{position:absolute;font-size:46px;opacity:.2;line-height:1}
.cover-btns{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}
.cover-btn{height:40px;min-width:40px;padding:0 12px 0 8px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink-strong);display:flex;align-items:center;gap:2px;font-weight:600;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cover-btn.round{padding:0;width:40px;justify-content:center}
.cover-card{position:relative;margin-top:-26px;background:#fff;border-radius:22px 22px 0 0;padding:0 16px 6px;text-align:center}
.cover-logo{width:68px;height:68px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);margin:0 auto;transform:translateY(-34px);margin-bottom:-26px;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--red)}
.cover-name{font-size:22px;font-weight:800;letter-spacing:-.01em}
.cover-meta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:6px;color:var(--muted);font-size:14px}
.cover-rate{display:inline-flex;align-items:center;gap:3px;color:#B88700;font-weight:700}
.cover-rate .ic{color:var(--star)}
.dot{width:3px;height:3px;border-radius:50%;background:#BDBDBD}
.skel{background:linear-gradient(90deg,#F1F1F1 25%,#F8F8F8 50%,#F1F1F1 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* Busca e abas de categoria */
.search{position:relative;margin:14px 16px 4px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;min-height:44px;border-radius:10px;border:0;background:var(--soft);padding:0 12px 0 40px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{box-shadow:0 0 0 2px rgba(234,29,44,.25)}
.cattabs{position:sticky;top:var(--sat);z-index:20;background:#fff;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 8px;border-bottom:1px solid var(--line);margin-top:6px}
.cattabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;min-height:48px;padding:0 10px;color:var(--muted);font-weight:600;font-size:14px;position:relative;white-space:nowrap}
.ctab.on{color:var(--red)}
.ctab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.ctab-add{color:var(--red);display:grid;place-items:center;min-width:44px}

/* Seções e cards de prato */
.sec-title{font-size:18px;font-weight:800;padding:22px 16px 6px}
.sec-sub{font-size:13px;color:var(--muted);padding:0 16px 4px}
.dish{display:flex;align-items:stretch;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;position:relative}
.dish:active{background:#FAFAFA}
.dish-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.dish-name{font-weight:700;font-size:16px;color:var(--ink-strong);line-height:1.25;overflow-wrap:anywhere}
.dish-orig{display:flex}
.dish-rate{display:flex;align-items:center;gap:6px;font-size:13px}
.dish-rate b{color:#8A6500;font-weight:700}
.dish-last{font-size:13px;color:var(--muted)}
.dish-thumb{width:92px;height:92px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1px solid var(--line);background:var(--red-soft);display:grid;place-items:center}
.dish-thumb img,.det-photo img,.foto-prev img,.sw-photo img,.tl-thumb img,.vs-photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:38px;line-height:1}
.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-art{font-size:46px;line-height:1}
.empty h3{font-size:18px}
.empty p{color:var(--muted);max-width:30ch}

/* Navegação inferior e botão de cadastrar */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:#8A8A8A;position:relative;white-space:nowrap}
.bnav button.on{color:var(--red)}
.nav-badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center}
.fabs{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(var(--nav-h) + 14px + var(--sab));display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:0 16px;z-index:25;pointer-events:none}
.fabs>*{pointer-events:auto}
.fab-add{width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(234,29,44,.35)}
.fab-add:active{transform:scale(.96)}

/* Painéis que sobem de baixo */
.sheet-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(20,20,20,.45);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:480px;max-height:calc(92% - var(--sat));background:#fff;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet.tall{height:calc(92% - var(--sat))}
.sheet.full{height:100%;max-height:100%;border-radius:0;padding-top:var(--sat)}
.sheet.dialog{max-width:420px;margin:0 12px calc(12px + var(--sab));border-radius:18px}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 6px 10px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.sheet-head h3{flex:1;font-size:17px;font-weight:800}
.sheet:not(.full) .sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;border-radius:4px;background:#DDD;transform:translateX(-50%)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--line);flex-shrink:0;background:#fff}
.dlg{padding:22px 20px 18px;display:flex;flex-direction:column;gap:10px}
.dlg h3{font-size:18px}
.dlg p{color:var(--muted)}
.dlg .row2{margin-top:10px}

/* Aviso flutuante */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 84px + var(--sab));transform:translate(-50%,20px);width:calc(100% - 32px);max-width:448px;background:#262626;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{flex:1}
.toast-act{color:#FF8A93;font-weight:700;min-height:36px;padding:0 6px}

/* Criação e código */
.created{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ok-ic{width:56px;height:56px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.code-big{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.code-big span{width:48px;height:58px;border-radius:10px;border:2px solid var(--red);display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.created .row2{width:100%}
.wa-link{font-size:14px;font-weight:600;color:var(--green);min-height:44px;display:inline-flex;align-items:center}

/* Detalhe do prato */
.det{display:flex;flex-direction:column;height:100%}
.det-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain;padding-bottom:calc(24px + var(--sab))}
.det-photo{position:relative;aspect-ratio:4/3;max-height:320px;width:100%;background:var(--red-soft);display:grid;place-items:center;overflow:hidden}
.det-photo .ph{font-size:84px}
.det-close{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.det-body{padding:18px 16px 0;display:flex;flex-direction:column;gap:12px}
.det-name{font-size:24px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.det-block{border-top:1px solid var(--line);padding-top:16px;margin-top:4px;display:flex;flex-direction:column;gap:10px}

.rate-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rate-row>span{font-weight:600}
.rate-sum{font-size:14px;color:var(--ink)}
.rate-sum b{color:var(--ink-strong)}
.done-sum{font-size:14px;color:var(--muted);text-align:center}
.dates{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.det-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}

/* Formulário */
.rest-wrap{margin-top:4px}
.foto-prev{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.foto-prev img{width:88px;height:88px;border-radius:10px;border:1px solid var(--line)}
.rate-lg .rstar{width:48px;height:48px}
.collapse{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;font-weight:700;color:var(--ink-strong)}
.collapse span{flex:1}

.collapse[aria-expanded="true"] .ic:last-child{transform:rotate(180deg)}
.quiz-attrs{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.qa-q{display:block;font-size:14px;font-weight:600;margin-bottom:6px}

/* Barra de progresso e topo dos jogos */
.qz-top{display:flex;align-items:center;gap:6px;padding:8px 8px 4px}
.qz-top .step{font-size:13px;color:var(--muted);font-weight:600;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.prog{flex:1;height:6px;border-radius:6px;background:#F0F0F0;overflow:hidden}

/* Aba "O que comer" */
.dec{padding:0 16px 8px}
.dec-intro{color:var(--muted);padding:14px 0 2px}
.filt{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.filt .lbl{font-size:13px;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.modo{display:flex;gap:14px;align-items:center;width:100%;padding:16px;border-radius:16px;border:1px solid #E4E4E4;margin-top:12px;text-align:left;background:#fff}
.modo:active{background:#FAFAFA}
.modo-ic{width:52px;height:52px;border-radius:14px;background:var(--red-soft);display:grid;place-items:center;font-size:26px;flex-shrink:0}
.modo-txt{flex:1;min-width:0}
.modo b{display:block;font-size:17px;color:var(--ink-strong)}
.modo small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.dec .btn-lg{margin-top:12px}

/* Telas de duelo: um em cima, um embaixo */
.vs{display:flex;flex-direction:column;height:100%;padding-bottom:calc(10px + var(--sab))}
.vs-q{text-align:center;font-size:24px;font-weight:800;padding:4px 16px 10px;color:var(--ink-strong);text-wrap:balance}
.vs-arena{flex:1;display:flex;flex-direction:column;padding:0 16px;min-height:0}
.vs-card{flex:1;min-height:0;display:flex;border:1.5px solid #E2E2E2;border-radius:18px;overflow:hidden;background:#fff;text-align:left;transition:transform .12s, border-color .12s, box-shadow .12s;width:100%}
.vs-card:active{transform:scale(.98);border-color:var(--red);box-shadow:0 0 0 3px rgba(234,29,44,.15)}
.vs-card.static:active{transform:none;border-color:#E2E2E2;box-shadow:none}
.vs-photo{width:42%;background:var(--red-soft);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.vs-photo .ph{font-size:56px}
.vs-photo.multi .ph{font-size:34px}
.vs-info{flex:1;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.vs-info b{font-size:20px;line-height:1.2;color:var(--ink-strong);overflow-wrap:anywhere}
.vs-info small{font-size:13px;color:var(--muted)}
.vs-or{align-self:center;margin:-16px 0;z-index:2;width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;border:4px solid #fff;flex-shrink:0}
.vs-actions{padding:12px 16px 0;display:flex;flex-direction:column;gap:4px}
.vs-actions .row2 .btn{min-height:50px}
.vs-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:8px}
.vs-scroll h2{font-size:24px;font-weight:800;padding:8px 16px 2px}
.vs-scroll>.muted{padding:0 16px 8px;font-size:14px}
.rk-sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:16px 16px 4px}
.rk-badge{font-size:12px;font-weight:700;background:var(--green-soft);color:var(--green);padding:3px 8px;border-radius:999px;white-space:nowrap}
.rk-badge.alt{background:var(--soft);color:var(--muted)}
.rk-out .tl-row{opacity:.55}
.rk-out summary{list-style:none;cursor:pointer}
.rk-out summary::-webkit-details-marker{display:none}
.winner{margin:8px 16px 4px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#EA1D2C,#C8101E);color:#fff;display:flex;gap:14px;align-items:center;width:calc(100% - 32px);text-align:left}
.winner .tl-thumb{width:72px;height:72px;border-radius:14px;background:rgba(255,255,255,.2)}
.winner small{display:block;opacity:.85;font-size:13px}
.winner b{display:block;font-size:22px;line-height:1.2}

/* Classificação rápida (arrastar) */
.sw{display:flex;flex-direction:column;height:100%;padding-bottom:calc(12px + var(--sab))}
.sw-top{display:flex;align-items:center;gap:6px;padding:8px 8px 0}
.sw-q{flex:1;text-align:center;font-weight:800;font-size:18px;color:var(--ink-strong)}
.sw-prog{padding:6px 20px 0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sw-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:12px 44px;min-height:280px;overflow:hidden}
.sw-side{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-weight:800;font-size:15px;letter-spacing:.04em;padding:14px 6px;border-radius:10px;transition:transform .15s, background .15s, color .15s}
.sw-side.l{left:6px;color:var(--opt-a);background:#EEF3FE;transform:translateY(-50%) rotate(180deg)}
.sw-side.r{right:6px;color:var(--opt-b);background:#FEF2E6}
.sw-side.l.hot{background:var(--opt-a);color:#fff}
.sw-side.r.hot{background:var(--opt-b);color:#fff}
.sw-stack{position:relative;width:100%;max-width:300px;aspect-ratio:3/4;max-height:100%}
.sw-card{position:absolute;inset:0;background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.14);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;touch-action:none;cursor:grab;--ta:0;--tb:0}

.sw-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--opt-a);opacity:calc(var(--ta) * .38)}
.sw-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--opt-b);opacity:calc(var(--tb) * .38);z-index:1}
.sw-photo{flex:1;min-height:0;background:var(--red-soft);display:grid;place-items:center;overflow:hidden}
.sw-photo .ph{font-size:90px}
.sw-info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.sw-info b{font-size:20px;color:var(--ink-strong);line-height:1.2}
.sw-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:6px 16px 0}
.sw-btns .btn{min-height:52px;padding:0 8px}
.btn-a{background:var(--opt-a);color:#fff}
.btn-b{background:var(--opt-b);color:#fff}
.btn-ab{background:var(--opt-ab);color:#fff}
.sw-sub{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0}
.sw-pick{padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}

.pick-q{display:flex;align-items:center;gap:12px;min-height:68px;padding:12px 16px;border-radius:14px;border:1px solid #E2E2E2;text-align:left;width:100%}

.pick-q b{display:block;font-size:16px;color:var(--ink-strong)}
.pick-q small{color:var(--muted);font-size:13px}

.toggle input{width:20px;height:20px;accent-color:var(--red)}

/* Tutorial de instalação */
.tut{display:flex;flex-direction:column;height:100%}
.tut-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 20px;overscroll-behavior:contain}
.tut-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0 14px}
.tut-hero h2{font-size:21px;font-weight:800}
.tut-hero p{color:var(--muted);max-width:32ch}
.tut-tabs{display:flex;justify-content:center;margin:4px 0 10px}
.tut-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tut-step{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.tut-n{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:14px}
.tut-txt{flex:1;display:flex;flex-direction:column;gap:4px;padding-top:3px}
.tut-txt small{color:var(--muted);font-size:13px}
.tut-ico{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:#0A7AFF;flex-shrink:0}
.tut-ico.and{color:#1E8E3E}
.tut-key{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;background:var(--soft);font-weight:700;color:var(--ink-strong);white-space:nowrap}
.tut-foot{padding:12px 20px calc(12px + var(--sab));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tut-ok{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 10px}

/* Histórico e configurações */
.topbar{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 4px;border-bottom:1px solid var(--line);position:sticky;top:var(--sat);background:#fff;z-index:20}
.topbar h1{flex:1;font-size:18px;font-weight:800;text-align:center}
.pad{padding:0 16px}
.seg-pill{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;margin:4px 16px 4px}
.seg-pill button{min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg-pill button[aria-pressed="true"]{background:#fff;color:var(--ink-strong);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tl-day{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:16px 16px 4px}
.tl-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;min-height:60px;border-bottom:1px solid var(--line)}
.tl-thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--red-soft);display:grid;place-items:center;flex-shrink:0}
.tl-thumb .ph{font-size:22px}
.tl-txt{flex:1;min-width:0}
.tl-txt b{display:block;color:var(--ink-strong);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-txt small{color:var(--muted);font-size:13px}
.rk-pos{width:26px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;text-align:center;flex-shrink:0}
.rk-n{font-weight:800;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.cfg-sec{padding:6px 16px 10px;border-bottom:8px solid var(--soft)}
.cfg-sec h2{font-size:16px;font-weight:800;padding:14px 0 6px}
.cfg-row{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:56px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cfg-row:last-child{border-bottom:0}
.cfg-row .grow{flex:1;min-width:0}
.cfg-row small{display:block;color:var(--muted);font-size:12px}
.cfg-row b{display:block;color:var(--ink-strong);overflow-wrap:anywhere}
.cfg-row .mono{letter-spacing:.18em;font-size:18px;font-variant-numeric:tabular-nums}
.cfg-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cfg-link{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.cfg-link span{flex:1}
.cfg-link b{display:block;color:var(--ink-strong)}
.cfg-link small{display:block;color:var(--muted);font-size:12px}

.cat-ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid button{height:44px;border-radius:10px;font-size:24px;display:grid;place-items:center}
.emoji-grid button[aria-pressed="true"]{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.foot-note{padding:18px 16px;color:var(--muted);font-size:12px;text-align:center}
.copybox{width:100%;min-height:110px;border:1px solid #DCDCDC;border-radius:10px;padding:12px;font-size:15px;resize:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

<div id="app">

  <svg class="ic" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>
  <b>Gire o celular para a vertical</b>
  <p class="muted">O Prato a Dois funciona só com o celular em pé.</p>
</div>

<script>
"use strict";
/* =====================================================================
 * PRATO A DOIS · interface
 * Regras puras e jogos ficam em logica.js (window.Logica). Aqui: tela, rede e eventos.
 *
 * MÁQUINAS DE ESTADO DESTE ARQUIVO (todas explícitas no objeto S):
 *   S.screen  "splash" → "fatal" | "onboard" → "home" ⇄ "card"        (ver TELAS)
 *   S.tab     "cardapio" | "decidir" | "historico" | "config"          (ver ABAS)
 *   S.carga   "carregando" → "pronto" | "lento" | "erro"; "ausente" volta pra home   (setCarga)
 *   S.sync    "desligado" → "conectando" → "ao-vivo" | "periodico"     (setSync)
 *   Falhas de início: FALHAS[codigo] → tela "fatal"
 *   Instalação: estadoInstalacao() → "instalado" | "ios-safari" | "ios-outro" | "android" | "computador"
 *   Jogos (duelo de categorias, isso ou aquilo) e papéis: logica.js
 *
 * Ações de clique: todo botão global tem data-act="..." (switch em "Ações globais").
 * Painéis têm botões com data-x="..." tratados dentro do próprio painel.
 * Depuração: window.__prato expõe S, T, Logica e a versão.
 * ===================================================================== */

/* ============================== Configuração ============================== */
const APP_NAME = "Prato a Dois";
const APP_VERSAO = "2.0.0";
const BANCO_VERSAO_MIN = 2; // "os dois" nos atributos precisa do banco v2 (supabase.sql)
const CFG = window.PRATO_CONFIG || {};
const L = window.Logica;
const TELAS = ["splash", "fatal", "onboard", "home", "card"];
const ABAS = [["cardapio", "book", "Cardápio"], ["decidir", "sparkle", "O que comer"], ["historico", "clock", "Histórico"], ["config", "sliders", "Configurações"]];

/* ============================== Comportamento de app (sem zoom, em pé) ============================== */
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
document.addEventListener("contextmenu", e => { if (e.target && e.target.tagName === "IMG") e.preventDefault(); });
function lockPortrait() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(() => {}); } catch (e) {} }
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ============================== Utilidades ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const fmt1 = n => n.toFixed(1).replace(".", ",");
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const daysAgo = s => dayNum(todayStr()) - dayNum(s);
const fmtDate = s => { const [y, m, d] = s.split("-"); return d + "/" + m + (Number(y) !== new Date().getFullYear() ? "/" + y : ""); };
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const byName = (a, b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" });
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const nowISO = () => new Date().toISOString();
const tsOf = s => { const t = Date.parse(s || ""); return isNaN(t) ? 0 : t; };
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // sem 0, O, 1, I, L
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
/* Armazenamento do aparelho. Chaves: pd:nome, pd:meus, pd:ultimo, pd:filtros, pd:tutorial (+ pd-auth da sessão). */
const MEM = {};
const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v == null ? (MEM[k] ?? null) : v; } catch (e) { return MEM[k] ?? null; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} },
  json(k) { try { return JSON.parse(LS.get(k) || "null"); } catch (e) { return null; } }
};

/* Plataforma e instalação */
const UA = navigator.userAgent || "";
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const isMobile = isIOS || isAndroid;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function estadoInstalacao() {
  if (isStandalone()) return "instalado";
  if (isIOS) return /CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(UA) ? "ios-outro" : "ios-safari";
  if (isAndroid) return "android";
  return "computador";
}
let installPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; const b = $("#instNow"); if (b) b.hidden = false; });
window.addEventListener("appinstalled", () => { installPrompt = null; LS.set("pd:tutorial", "1"); toast("App instalado! Abra pelo ícone na tela inicial."); });

const ATTRS = L.ATRIBUTOS;

/* Tabelas espelhadas do Supabase (só do cardápio aberto) */
const T = { cardapios: new Map(), membros: new Map(), categorias: new Map(), pratos: new Map(), notas: new Map(), feitos: new Map(), fotos: new Map() };
const PK = { cardapios: ["codigo"], membros: ["cardapio", "user_id"], categorias: ["id"], pratos: ["id"], notas: ["prato_id", "user_id"], feitos: ["id"], fotos: ["prato_id"] };
const keyOf = (t, r) => PK[t].map(k => r[k]).join("|");
const put = (t, r) => { if (r) T[t].set(keyOf(t, r), r); };
const temDados = () => !!(S.cur && T.cardapios.get(S.cur));
function dropPrato(id) {
  T.pratos.delete(id); T.fotos.delete(id);
  for (const [k, n] of T.notas) if (n.prato_id === id) T.notas.delete(k);
  for (const [k, f] of T.feitos) if (f.prato_id === id) T.feitos.delete(k);
}
/* Monta o formato usado pela interface a partir das tabelas */
function compose() {
  const c = T.cardapios.get(S.cur);
  if (!c) S.card = null;
  else {
    const membros = {}; T.membros.forEach(m => { membros[m.user_id] = { nome: m.nome, papel: m.papel, ts: tsOf(m.criado_em) }; });
    const categorias = {}; T.categorias.forEach(k => { categorias[k.id] = { nome: k.nome, icone: k.icone, ordem: k.ordem }; });
    S.card = { codigo: c.codigo, nome: c.nome, dono: c.dono, membros, categorias };
  }
  const pr = {};
  T.pratos.forEach(p => {
    const f = T.fotos.get(p.id);
    pr[p.id] = { nome: p.nome, origem: p.origem, restaurante: p.restaurante || "", categorias: p.categorias || [], foto: f ? f.data : null,
      quiz: { tempo: p.tempo, peso: p.peso, sabor: p.sabor, ocasiao: p.ocasiao }, notas: {}, feitos: {}, criadoPor: p.criado_por, criadoEm: tsOf(p.criado_em) || Date.now() };
  });
  T.notas.forEach(n => { if (pr[n.prato_id]) pr[n.prato_id].notas[n.user_id] = n.nota; });
  T.feitos.forEach(f => { if (pr[f.prato_id]) pr[f.prato_id].feitos[f.id] = { d: String(f.data).slice(0, 10), por: f.por, ts: tsOf(f.criado_em) }; });
  S.pratos = pr;
}
function changed() { compose(); scheduleRender(); }

let sb = null;
const isNet = e => /Failed to fetch|NetworkError|Load failed|network|fetch failed/i.test(String((e && e.message) || ""));
async function q(builder) { const r = await builder; if (r.error) throw r.error; return r.data; }
async function q2(fn) { try { return await q(fn()); } catch (e) { if (isNet(e)) { await sleep(700); return await q(fn()); } throw e; } }
function errMsg(e) {
  const m = String((e && (e.message || e.error_description || e.msg)) || "");
  const c = e && e.code;
  if (/Só o dono/.test(m)) return "Só o dono pode fazer isso.";
  if (/Mudança de papel não permitida/.test(m)) return "Essa mudança de papel não é permitida. Atualize a tela e tente de novo.";
  if (c === "23514" && /tempo|peso|sabor|ocasiao/.test(m)) return "O banco ainda não aceita “os dois”. Rode o supabase.sql de novo no Supabase (versão 2).";
  if (c === "42501" || /row-level security|permission denied/i.test(m)) return "Você não tem permissão para isso neste cardápio.";
  if (c === "23505") return "Isso já existe.";
  if (isNet(e)) return "Sem conexão com o servidor. Confira a internet e tente de novo.";
  if (/JWT|token|session/i.test(m)) return "Sua sessão expirou. Feche e abra o app de novo.";
  return "Não deu certo: " + (m || "tente de novo").slice(0, 140);
}
async function act(fn, opts = {}) {
  try { await fn(); return true; }
  catch (e) { console.warn(e); if (!opts.silent) toast(opts.msg || errMsg(e)); return false; }
}
async function checarVersaoBanco() {
  try { S.versaoBanco = Number(await q(sb.rpc("versao_banco"))) || 1; } catch (e) { S.versaoBanco = 1; }
  if (S.screen === "card") scheduleRender();
}

const sheetStack = [];
function lockScroll() { document.documentElement.classList.toggle("locked", sheetStack.length > 0); }
function openSheet({ html, cls = "", onClose }) {
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.style.zIndex = String(60 + sheetStack.length * 2);
  wrap.innerHTML = `<div class="sheet-bg"></div><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(wrap);
  const s = { wrap, el: wrap.querySelector(".sheet"), onClose };
  sheetStack.push(s);
  lockScroll();
  wrap.querySelector(".sheet-bg").addEventListener("click", () => closeSheet(s));
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("open")));
  return s;
}
function closeSheet(s) {
  s = s || sheetStack[sheetStack.length - 1];
  if (!s) return;
  const i = sheetStack.indexOf(s);
  if (i < 0) return;
  sheetStack.splice(i, 1);
  s.wrap.classList.remove("open");
  setTimeout(() => s.wrap.remove(), 260);
  const cb = s.onClose; s.onClose = null;
  if (cb) cb();
  lockScroll();
}
function closeAllSheets() { while (sheetStack.length) closeSheet(sheetStack[sheetStack.length - 1]); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetStack.length) closeSheet(); });

let toastT = null;
function toast(msg, opt = {}) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${opt.action ? `<button class="toast-act">${esc(opt.action)}</button>` : ""}`;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), opt.ms || (opt.action ? 6000 : 3200));
  if (opt.action) t.querySelector(".toast-act").onclick = () => { t.classList.remove("show"); opt.onAction && opt.onAction(); };
}
function confirmDlg({ title, text, ok = "Confirmar", danger = false }) {
  return new Promise(res => {
    const s = openSheet({ cls: "dialog", onClose: () => res(false), html: `<div class="dlg"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ""}<div class="row2"><button class="btn btn-ghost" data-x="no">Cancelar</button><button class="btn ${danger ? "btn-danger" : "btn-red"}" data-x="ok">${esc(ok)}</button></div></div>` });
    s.el.querySelector('[data-x="ok"]').onclick = () => { s.onClose = null; closeSheet(s); res(true); };
    s.el.querySelector('[data-x="no"]').onclick = () => closeSheet(s);
  });
}
function textSheet({ title, label, value = "", placeholder = "", ok = "Salvar", max = 40, emoji = null }) {
  return new Promise(res => {
    let em = emoji;
    const s = openSheet({ onClose: () => res(null), html: `
      <div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close")}</button></div>
      <form class="sheet-body" id="tsForm" style="display:flex;flex-direction:column;gap:14px">
        <div><label class="lbl" for="tsInp">${esc(label)}</label><input id="tsInp" class="inp" maxlength="${max}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off"></div>
        ${em ? `<div><span class="lbl">Ícone</span><div class="emoji-grid">${EMOJIS.map(x => `<button type="button" data-x="em" data-v="${x}" aria-pressed="${x === em}">${x}</button>`).join("")}</div></div>` : ""}
        <button class="btn btn-red btn-lg" type="submit">${esc(ok)}</button>
      </form>` });
    const inp = $("#tsInp", s.el);
    setTimeout(() => { inp.focus(); inp.select(); }, 280);
    s.el.addEventListener("click", e => {
      const b = e.target.closest("[data-x]"); if (!b) return;
      if (b.dataset.x === "close") closeSheet(s);
      if (b.dataset.x === "em") { em = b.dataset.v; $$('[data-x="em"]', s.el).forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === em))); }
    });
    $("#tsForm", s.el).addEventListener("submit", e => { e.preventDefault(); const v = inp.value.trim(); s.onClose = null; closeSheet(s); res({ value: v, emoji: em }); });
  });
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove();
    if (ok) { toast(okMsg); return; }
  } catch (e) {}
  const s = openSheet({ html: `<div class="sheet-head"><h3>Copie a mensagem</h3><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close")}</button></div><div class="sheet-body"><p class="muted" style="margin-bottom:10px">Não consegui copiar sozinho. Segure o texto abaixo e toque em Copiar.</p><textarea class="copybox" id="cpBox" readonly>${esc(text)}</textarea></div>` });
  s.el.querySelector('[data-x="close"]').onclick = () => closeSheet(s);
  setTimeout(() => { const b = $("#cpBox", s.el); if (b) { b.focus(); b.select(); } }, 300);
}

const waHref = code => "https://wa.me/?text=" + encodeURIComponent(shareText(code));
async function shareCode(code) {
  const text = shareText(code);
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  copyText(text, "Mensagem copiada. É só colar no WhatsApp.");
}

  configInvalida:{ titulo: "Configuração inválida", texto: "Confira a Project URL e a chave no config.js.", retry: false },

function falhar(codigo, texto) { S.screen = "fatal"; S.fatal = Object.assign({ codigo }, FALHAS[codigo], texto ? { texto } : {}); render(); }
async function boot() {
  render();

  let url = String(CFG.supabaseUrl || "").trim();
  const key = String(CFG.supabaseKey || "").trim();
  // Aceita a URL mesmo colada com /rest/v1/ ou outro caminho no fim: usa só https://xxxx.supabase.co
  try { if (/^https?:\/\//i.test(url)) url = new URL(url).origin; } catch (e) {}
  if (!/^https?:\/\/[^ ]+$/.test(url) || !key || /COLE_AQUI/.test(url + key)) return falhar("semConfig");
  if (!window.supabase || !window.supabase.createClient) return falhar("semBiblioteca");
  try {
    sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "pd-auth" } });
  } catch (e) { return falhar("configInvalida"); }
  let session = null;
  try { const r = await sb.auth.getSession(); session = r.data && r.data.session; } catch (e) {}
  if (!session) {
    const r = await sb.auth.signInAnonymously();
    if (r.error) {
      const m = String(r.error.message || "");
      if (/anonymous/i.test(m)) return falhar("semAnonimo");
      if (/Invalid API key|apikey|No API key/i.test(m)) return falhar("chaveInvalida");
      if (/Invalid path/i.test(m)) return falhar("urlInvalida");
      return falhar("semLogin", errMsg(r.error));

async function loadAll(code) {
  try {
    const col = t => t === "cardapios" ? "codigo" : "cardapio";
    const res = await Promise.all(TBL.map(t => q2(() => sb.from(t).select("*").eq(col(t), code))));
    if (S.cur !== code) return;
    TBL.forEach((t, i) => { T[t].clear(); res[i].forEach(r => put(t, r)); });
    if (!T.cardapios.get(code)) return cardapioSumiu(code);
    clearTimeout(S.slowT);
    S.carga = "pronto"; S.cargaErro = "";
    const me = T.membros.get(code + "|" + S.uid);
    setMeu(code, { nome: T.cardapios.get(code).nome, papel: me ? me.papel : "visitante", pend: Array.from(T.membros.values()).filter(m => m.papel === "pendente").length });

async function loadFotos(code) {
  const meta = await q2(() => sb.from("fotos").select("prato_id,atualizado_em").eq("cardapio", code));
  if (S.cur !== code) return;
  const want = new Set(meta.map(m => m.prato_id));
  Array.from(T.fotos.keys()).forEach(k => { if (!want.has(k)) T.fotos.delete(k); });
  const need = meta.filter(m => { const c = T.fotos.get(m.prato_id); return !c || c.atualizado_em !== m.atualizado_em; }).map(m => m.prato_id);
  for (let i = 0; i < need.length; i += 15) {
    const chunk = need.slice(i, i + 15);
    const rows = await q2(() => sb.from("fotos").select("*").in("prato_id", chunk));
    if (S.cur !== code) return;
    rows.forEach(r => put("fotos", r));
    changed();
  }
  if (!need.length) changed();
}
async function refetchFoto(id) {
  const code = S.cur;
  try { const rows = await q2(() => sb.from("fotos").select("*").eq("prato_id", id)); if (S.cur === code) { rows.forEach(r => put("fotos", r)); changed(); } } catch (e) {}
}
function subscribe(code) {
  unsubscribe();
  setSync("conectando");
  try {
    const ch = sb.channel("pd-" + code + "-" + Math.random().toString(36).slice(2, 7));
    ["membros", "categorias", "pratos", "notas", "feitos", "fotos"].forEach(t => {
      ch.on("postgres_changes", { event: "INSERT", schema: "public", table: t, filter: "cardapio=eq." + code }, p => onRT(t, p, code));
      ch.on("postgres_changes", { event: "UPDATE", schema: "public", table: t, filter: "cardapio=eq." + code }, p => onRT(t, p, code));
      ch.on("postgres_changes", { event: "DELETE", schema: "public", table: t }, p => onRT(t, p, code));
    });
    ch.on("postgres_changes", { event: "UPDATE", schema: "public", table: "cardapios", filter: "codigo=eq." + code }, p => onRT("cardapios", p, code));
    ch.subscribe(st => {
      if (S.cur !== code) return;
      if (st === "SUBSCRIBED") { stopPoll(); setSync("ao-vivo"); }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") startPoll();
    });
    S.channel = ch;
  } catch (e) { console.warn("realtime", e); }
  S.rtT = setTimeout(() => { if (S.sync !== "ao-vivo" && S.cur === code) startPoll(); }, 8000);
}
function onRT(t, p, code) {
  if (S.cur !== code) return;
  if (p.eventType === "DELETE") {
    const k = keyOf(t, p.old || {});
    if (T[t].has(k)) { if (t === "pratos") dropPrato(p.old.id); else T[t].delete(k); changed(); }
    return;
  }
  const row = p.new; if (!row) return;
  if (t === "cardapios") { if (row.codigo === code) { put(t, Object.assign({}, T.cardapios.get(code), row)); changed(); } return; }
  if (row.cardapio !== code) return;
  if (t === "fotos" && (typeof row.data !== "string" || row.data.indexOf("data:image/") !== 0)) { refetchFoto(row.prato_id); return; }
  put(t, row); changed();
}
function startPoll() {
  setSync("periodico");

function stopPoll() { clearInterval(S.pollT); S.pollT = null; }
function unsubscribe() {
  if (S.channel && sb) { try { sb.removeChannel(S.channel); } catch (e) {} }
  S.channel = null; stopPoll(); clearTimeout(S.rtT); clearTimeout(S.slowT);
  setSync("desligado");
}

function renderFabs() {

function shellCardapio() {

function updateCardParts() {

const BANNER_EMO = [["🍕", "8%", "14%"], ["🍣", "30%", "52%"], ["🍔", "58%", "8%"], ["🍝", "80%", "46%"], ["🥗", "92%", "4%"]];

function bannersHTML() {

  else if (S.carga === "lento") h += `<div class="banner banner-warn"><span class="grow">Está demorando para carregar. Confira a internet.</span><button class="btn btn-sm btn-ghost" data-act="retry">Tentar de novo</button></div>`;

function sectionsHTML(list, gs) {
  if (!temDados()) return [1, 2, 3].map(() => `<div class="dish"><span class="dish-info"><span class="skel" style="height:18px;width:60%"></span><span class="skel" style="height:14px;width:40%"></span><span class="skel" style="height:14px;width:50%"></span></span><span class="dish-thumb skel"></span></div>`).join("");
  if (!list.length) {
    return `<div class="empty"><div class="empty-art">🍳</div><h3>Nenhum prato ainda</h3><p>${canEdit() ? "Que tal cadastrar o último que vocês fizeram?" : "Quando os donos cadastrarem pratos, eles aparecem aqui."}</p>${canEdit() ? `<button class="btn btn-red" data-act="add">${ic("plus", 18)} Cadastrar prato</button>` : ""}</div>`;
  }
  const qs = norm(S.search);
  if (qs) {
    const found = list.filter(p => norm(p.nome).includes(qs) || norm(p.restaurante).includes(qs)).sort(byName);
    if (!found.length) return `<div class="empty"><div class="empty-art">🔎</div><h3>Nada com “${esc(S.search.trim())}”</h3><p>Confira a grafia ou procure por outro nome.</p></div>`;
    return `<section class="sec"><h2 class="sec-title">${plural(found.length, "resultado", "resultados")}</h2>${found.map(dishCard).join("")}</section>`;

}

/* Abas de categoria que acompanham a rolagem */
let spyLock = 0, spyRaf = false;
function setActiveTab(id, scrollTabs) {
  if (!id) return;
  S.activeCat = id;
  $$(".ctab[data-cat]").forEach(b => b.classList.toggle("on", b.dataset.cat === id));
  if (scrollTabs) {
    const b = $(`.ctab[data-cat="${CSS.escape(id)}"]`), bar = $("#cattabs");
    if (b && bar) bar.scrollTo({ left: Math.max(0, b.offsetLeft - 24), behavior: reduceMotion() ? "auto" : "smooth" });
  }
}
window.addEventListener("scroll", () => {
  if (S.screen !== "card" || S.tab !== "cardapio" || spyRaf) return;
  spyRaf = true;
  requestAnimationFrame(() => {
    spyRaf = false;
    if (Date.now() < spyLock) return;
    const bar = $("#cattabs"); if (!bar || bar.hidden) return;
    const off = bar.getBoundingClientRect().bottom + 12;
    let a = null;
    for (const sec of $$(".sec[data-cat]")) { if (sec.getBoundingClientRect().top <= off) a = sec.dataset.cat; else break; }
    if (!a) { const f = $(".sec[data-cat]"); a = f ? f.dataset.cat : null; }
    if (a && a !== S.activeCat) setActiveTab(a, true);
  });
}, { passive: true });
function scrollToCat(id) {
  const sec = document.getElementById("sec-" + id), bar = $("#cattabs");
  if (!sec || !bar) return;
  setActiveTab(id, true);
  spyLock = Date.now() + 900;
  const top = parseFloat(getComputedStyle(bar).top) || 0;
  const y = sec.getBoundingClientRect().top + window.scrollY - bar.offsetHeight - top + 1;
  window.scrollTo({ top: y, behavior: reduceMotion() ? "auto" : "smooth" });
}

/* ---------- Aba "O que comer" ---------- */
function topbar(title) {
  return `<div class="topbar"><button class="icon-btn" data-act="home" aria-label="Meus cardápios">${ic("chevL", 22)}</button><h1>${esc(title)}</h1><button class="icon-btn" data-act="refresh" aria-label="Atualizar">${ic("refresh", 20)}</button></div>`;
}
const poolAtual = () => L.filtrar(pratosArr(), S.filtros);
function categoriasNoPool(pool) {
  const ids = catsSorted().map(c => c.id).filter(id => pool.some(x => (x.prato.categorias || []).includes(id)));
  const known = new Set(catsSorted().map(c => c.id));
  if (pool.some(x => !(x.prato.categorias || []).some(id => known.has(id)))) ids.push("_outros");
  return ids;
}
function filtroSeg(k, a, b) {
  const v = S.filtros[k] || "";
  const btn = (val, rot) => `<button class="seg-b" data-act="filt" data-k="${k}" data-v="${val}" aria-pressed="${v === val}">${esc(rot)}</button>`;
  return `<div class="seg seg-3">${btn(a[0], a[1])}${btn("", "Tanto faz")}${btn(b[0], b[1])}</div>`;
}
function viewDecidir() {
  if (!temDados()) return topbar("O que vamos comer?") + `<div class="center-screen"><div class="loader"></div></div>`;

  const pool = poolAtual();
  const n = pool.length;
  const extras = ATTRS.filter(a => S.filtros[a.key]).length;
  const nf = L.filtrosAtivos(S.filtros);
  const comAttr = ps.filter(L.temAtributo).length;
  const poucos = canEdit() && comAttr < ps.length / 2;
  const ncat = categoriasNoPool(pool).length;
  return topbar("O que vamos comer?") + `<div class="dec">
    <p class="dec-intro">Filtre se quiser e escolha um jeito de decidir.</p>
    <section class="filt" aria-label="Filtros">
      <div><span class="lbl">Onde</span>${filtroSeg("origem", ["casa", "Em casa"], ["restaurante", "Pedir"])}</div>
      <button class="collapse" data-act="filt-mais" aria-expanded="${S.filtrosAbertos}">${ic("sliders", 18)}<span>Mais filtros${extras ? ` <small>${plural(extras, "ativo", "ativos")}</small>` : ""}</span>${ic("chevD", 18)}</button>
      <div class="filt-more" ${S.filtrosAbertos ? "" : "hidden"}>
        ${ATTRS.map(a => `<div><span class="lbl">${esc(a.q)}</span>${filtroSeg(a.key, a.a, a.b)}</div>`).join("")}
        <p class="hint" style="margin:0">Pratos marcados com “os dois” ou ainda sem resposta continuam no páreo.</p>
      </div>
      <div class="filt-foot"><b id="poolCount">${plural(n, "prato no páreo", "pratos no páreo")}</b>${nf ? `<button class="btn-text" data-act="filt-limpar">Limpar filtros</button>` : ""}</div>
    </section>
    ${poucos ? `<div class="banner banner-info" style="margin:12px 0 0;width:100%">${ic("sparkle", 18)}<span class="grow">Só ${comAttr} de ${ps.length} pratos têm tempo, peso, sabor e ocasião. Os filtros ficam melhores com eles.</span><button class="btn btn-sm btn-red" data-act="classify">Classificar</button></div>` : ""}
    <button class="modo" data-act="jogo-categorias" ${ncat ? "" : "disabled"}><span class="modo-ic" aria-hidden="true">🍕</span><span class="modo-txt"><b>Escolher pela categoria</b><small>Hambúrguer ou pizza? Pizza ou risoto? Vai eliminando até sobrar a de hoje.</small></span>${ic("chevR", 20)}</button>
    <button class="modo" data-act="jogo-iou" ${n ? "" : "disabled"}><span class="modo-ic" aria-hidden="true">🆚</span><span class="modo-txt"><b>Isso ou aquilo</b><small>Prato contra prato. No fim sai um ranking, e dá para refinar.</small></span>${ic("chevR", 20)}</button>
    <button class="btn btn-ghost btn-lg" data-act="sortear" ${n ? "" : "disabled"}>${ic("shuffle", 18)} Sortear um prato</button>
    ${n ? "" : `<p class="hint" style="text-align:center">Nenhum prato passa nesses filtros. Tente afrouxar algum.</p>`}
  </div>`;
}
function setFiltro(k, v) {
  S.filtros = Object.assign({}, S.filtros, { [k]: v || null });
  LS.set("pd:filtros", JSON.stringify(S.filtros));

function sortearDe(ids, msg) {

  openDetail(id);

}

/* Cartões dos duelos (um em cima, um embaixo) */
function vsCardPrato(id, x, estatico) {
  const p0 = S.pratos[id];
  if (!p0) return `<button class="vs-card ${estatico ? "static" : ""}" ${x ? `data-x="${x}"` : ""}><span class="vs-photo"><span class="ph">🗑️</span></span><span class="vs-info"><b>Prato excluído</b><small>Pode escolher o outro.</small></span></button>`;
  const p = Object.assign({ id }, p0);
  return `<button class="vs-card ${estatico ? "static" : ""}" ${x ? `data-x="${x}"` : ""} aria-label="${esc(p.nome)}">
    <span class="vs-photo">${validFoto(p.foto) ? `<img src="${p.foto}" alt="" draggable="false">` : `<span class="ph" aria-hidden="true">${esc(catIcon(p))}</span>`}</span>
    <span class="vs-info"><b>${esc(p.nome)}</b><span class="dish-orig">${origHTML(p)}</span><span class="dish-rate">${rateHTML(p)}</span><small>${esc(lastTxt(p))}</small></span>
  </button>`;
}
function catInfo(id) {
  if (id === "_outros") return { nome: "Outros", icone: "🍴" };
  const c = S.card && S.card.categorias && S.card.categorias[id];
  return c ? { nome: c.nome, icone: c.icone || "🍴" } : { nome: "Categoria excluída", icone: "🍴" };
}
function pratosDasCategorias(pool, ids) {
  const known = new Set(catsSorted().map(c => c.id));
  return pool.filter(x => ids.some(id => id === "_outros"
    ? !(x.prato.categorias || []).some(c => known.has(c))
    : (x.prato.categorias || []).includes(id)));
}
const nomesCats = ids => { const n = ids.map(id => catInfo(id).nome); return n.length > 1 ? n.slice(0, -1).join(", ") + " e " + n[n.length - 1] : n[0] || ""; };
function vsCardCats(ids, pool, x) {
  const ps = pratosDasCategorias(pool, ids);
  const icones = ids.slice(0, 3).map(id => catInfo(id).icone).join("");
  const prev = ps.slice(0, 3).map(i => i.prato.nome).join(", ") + (ps.length > 3 ? "…" : "");
  return `<button class="vs-card" data-x="${x}" aria-label="${esc(nomesCats(ids))}">
    <span class="vs-photo ${ids.length > 1 ? "multi" : ""}"><span class="ph" aria-hidden="true">${esc(icones)}</span></span>
    <span class="vs-info"><b>${esc(nomesCats(ids))}</b><small>${plural(ps.length, "prato", "pratos")}</small><small>${esc(prev)}</small></span>
  </button>`;
}

/* Jogo 1 · Duelo de categorias (máquina em logica.js: dueloIniciar/dueloEscolher/dueloDesfazer) */
function openDueloCategorias() {
  const pool = poolAtual();
  let st = L.dueloIniciar(categoriasNoPool(pool));
  const s = openSheet({ cls: "full", html: `<div class="vs" id="vs"></div>` });
  const el = s.el;
  const paint = () => {
    const box = $("#vs", el);
    if (st.fase === "duelando") {
      const desafiante = st.fila[0];
      box.innerHTML = `<div class="qz-top"><button class="icon-btn" data-x="desfazer" aria-label="Desfazer" ${st.anterior ? "" : "disabled"}>${ic("undo", 21)}</button><div class="prog"><i style="width:${st.passo / Math.max(1, st.total) * 100}%"></i></div><span class="step">${st.passo + 1} de ${st.total}</span><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close", 22)}</button></div>
        <h2 class="vs-q">${esc(nomesCats(st.campeao))} ou ${esc(catInfo(desafiante).nome)}?</h2>
        <div class="vs-arena">${vsCardCats(st.campeao, pool, "campeao")}<span class="vs-or" aria-hidden="true">ou</span>${vsCardCats([desafiante], pool, "desafiante")}</div>
        <div class="vs-actions"><button class="btn btn-ghost btn-lg" data-x="os-dois">Tanto faz, fico com os dois</button></div>`;
      return;
    }
    const itens = L.ordenarSugestoes(pratosDasCategorias(pool, st.campeao), todayStr());
    const ids = itens.map(i => i.prato.id);
    box.innerHTML = `<div class="qz-top"><button class="icon-btn" data-x="desfazer" aria-label="Desfazer" ${st.anterior ? "" : "disabled"}>${ic("undo", 21)}</button><div class="prog"><i style="width:100%"></i></div><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close", 22)}</button></div>
      <div class="vs-scroll"><h2>Hoje é dia de ${esc(nomesCats(st.campeao))}</h2><p class="muted">${plural(ids.length, "prato", "pratos")} nessa linha. Toque num prato para ver os detalhes.</p>
        <div style="border-top:1px solid var(--line)">${itens.map(i => dishCard(i.prato)).join("")}</div></div>
      <div class="vs-actions"><div class="row2"><button class="btn btn-red" data-x="iou" ${ids.length > 1 ? "" : "disabled"}>🆚 Isso ou aquilo</button><button class="btn btn-ghost" data-x="sortear" ${ids.length ? "" : "disabled"}>${ic("shuffle", 18)} Sortear</button></div><button class="btn btn-text" data-x="refazer">Refazer do começo</button></div>`;
    S.dueloIds = ids;
  };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-x]"); if (!b || b.disabled) return;
    const x = b.dataset.x;
    if (x === "close") closeSheet(s);
    else if (x === "campeao" || x === "desafiante" || x === "os-dois") { st = L.dueloEscolher(st, x); paint(); }
    else if (x === "desfazer") { st = L.dueloDesfazer(st); paint(); }
    else if (x === "refazer") { st = L.dueloIniciar(categoriasNoPool(pool)); paint(); }
    else if (x === "sortear") sortearDe(S.dueloIds || []);
    else if (x === "iou") openIssoOuAquilo(S.dueloIds || []);
  });
  paint();
}

/* Jogo 2 · Isso ou aquilo (máquina em logica.js: iouIniciar/iouEscolher/iouDesfazer/iouRanking/iouNovaRodada) */
function openIssoOuAquilo(ids) {
  let st = L.iouIniciar(ids);
  const desempate = (a, b) => ((media(S.pratos[b] || {}) ?? -1) - (media(S.pratos[a] || {}) ?? -1)) || String((S.pratos[a] || {}).nome || "").localeCompare(String((S.pratos[b] || {}).nome || ""), "pt-BR");
  const s = openSheet({ cls: "full", html: `<div class="vs" id="iou"></div>` });
  const el = s.el;
  const linha = (id, pos, direita) => { const p = S.pratos[id]; return p ? tlRow(Object.assign({ id }, p), lastTxt(p), direita, pos ? `<span class="rk-pos">${pos}</span>` : "") : ""; };
  const vit = id => { const n = st.vitorias[id] || 0; return n ? `<span class="rk-badge">${plural(n, "vitória", "vitórias")}</span>` : ""; };
  const paint = () => {
    const box = $("#iou", el);
    const topo = (prog, passo) => `<div class="qz-top"><button class="icon-btn" data-x="desfazer" aria-label="Desfazer" ${st.anterior ? "" : "disabled"}>${ic("undo", 21)}</button><div class="prog"><i style="width:${prog}%"></i></div><span class="step">${passo}</span><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close", 22)}</button></div>`;
    if (st.fase === "jogando") {
      const par = st.pares[st.i];
      const passo = `${st.i + 1} de ${st.pares.length}`;
      const prog = st.i / st.pares.length * 100;
      if (par.length === 2) {
        box.innerHTML = topo(prog, passo) + `<h2 class="vs-q">Isso ou aquilo?</h2>
          <div class="vs-arena">${vsCardPrato(par[0], "cima")}<span class="vs-or" aria-hidden="true">ou</span>${vsCardPrato(par[1], "baixo")}</div>
          <div class="vs-actions"><button class="btn btn-ghost btn-lg" data-x="os-dois">Nenhum agora: os dois pro final</button><p class="hint" style="text-align:center;margin:2px 0 0">Rodada ${st.rodada} · o que você não escolher sai da disputa.</p></div>`;
      } else {
        box.innerHTML = topo(prog, passo) + `<h2 class="vs-q">Esse ficou sem par</h2>
          <div class="vs-arena">${vsCardPrato(par[0], null, true)}</div>
          <div class="vs-actions"><div class="row2"><button class="btn btn-ghost" data-x="descarta">Descartar</button><button class="btn btn-red" data-x="fica">Fica no ranking</button></div></div>`;
      }
      return;
    }
    const r = L.iouRanking(st, desempate);
    const vivos = r.ganharam.concat(r.final).filter(id => S.pratos[id]);
    const k = vivos.length;
    let corpo = `<h2>Ranking${st.rodada > 1 ? ` · rodada ${st.rodada}` : ""}</h2>`;
    if (k === 1) {
      const p = S.pratos[vivos[0]];
      corpo += `<p class="muted">Sobrou um só. Decidido!</p><button class="winner" data-act="dish" data-id="${esc(vivos[0])}">${thumb(Object.assign({ id: vivos[0] }, p), "tl-thumb")}<span><small>Vencedor</small><b>${esc(p.nome)}</b></span></button>`;
    } else if (!k) corpo += `<p class="muted">Todos foram descartados. Recomece com todos para tentar de novo.</p>`;
    else corpo += `<p class="muted">${plural(k, "prato continua", "pratos continuam")} na disputa. Jogue de novo só com eles para refinar.</p>`;
    if (r.ganharam.length) corpo += `<div class="rk-sec">Ganharam a disputa</div>` + r.ganharam.map((id, i) => linha(id, i + 1, vit(id))).join("");
    if (r.final.length) corpo += `<div class="rk-sec">Foram pro final</div>` + r.final.map(id => linha(id, null, vit(id) || `<span class="rk-badge alt">sem escolha</span>`)).join("");
    if (r.descartados.length) corpo += `<details class="rk-out"><summary class="rk-sec">Descartados (${r.descartados.length}) · ver</summary>${r.descartados.map(id => linha(id)).join("")}</details>`;
    box.innerHTML = topo(100, `Rodada ${st.rodada}`) + `<div class="vs-scroll">${corpo}</div>
      <div class="vs-actions">
        <button class="btn btn-red btn-lg" data-x="rodada" ${k > 1 ? "" : "disabled"}>Jogar de novo só com estes (${k})</button>
        <div class="row2"><button class="btn btn-ghost" data-x="todos">Recomeçar com todos (${st.todos.length})</button><button class="btn btn-ghost" data-x="sortear" ${k ? "" : "disabled"}>${ic("shuffle", 18)} Sortear</button></div>
      </div>`;
    S.iouVivos = vivos;
  };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-x]"); if (!b || b.disabled) return;
    const x = b.dataset.x;
    if (x === "close") closeSheet(s);
    else if (["cima", "baixo", "os-dois", "fica", "descarta"].includes(x)) { st = L.iouEscolher(st, x); paint(); }
    else if (x === "desfazer") { st = L.iouDesfazer(st); paint(); }
    else if (x === "rodada") { st = L.iouNovaRodada(st, "ranking"); paint(); }
    else if (x === "todos") { st = L.iouNovaRodada(st, "todos"); paint(); }
    else if (x === "sortear") sortearDe(S.iouVivos || []);
  });
  paint();
}

/* ---------- Histórico ---------- */
function dayLabel(s) {
  const n = daysAgo(s);
  if (n === 0) return "Hoje";
  if (n === 1) return "Ontem";
  const [y, m, d] = s.split("-").map(Number);
  return `${WD[new Date(y, m - 1, d).getDay()]}, ${fmtDate(s)}`;
}
function tlRow(p, sub, right = "", left = "") {
  return `<button class="tl-row" data-act="dish" data-id="${esc(p.id)}">${left}${thumb(p, "tl-thumb")}<span class="tl-txt"><b>${esc(p.nome)}</b><small>${esc(sub || "")}</small></span>${right}</button>`;
}
function viewHist() {
  const ps = pratosArr();
  if (!temDados()) return topbar("Histórico") + `<div class="center-screen"><div class="loader"></div></div>`;
  const events = [];
  ps.forEach(p => feitosList(p).forEach(f => events.push(Object.assign({ p }, f))));
  events.sort((a, b) => b.d.localeCompare(a.d) || (b.ts - a.ts));
  const counts = ps.map(p => ({ p, n: feitosList(p).filter(f => S.histRange === "all" || daysAgo(f.d) < 90).length }))
    .filter(x => x.n > 0).sort((a, b) => b.n - a.n || byName(a.p, b.p)).slice(0, 10);
  const saudade = ps.map(p => {
    const m = media(p); if (m == null || m < 4) return null;
    const last = ultima(p);
    const dias = last ? daysAgo(last) : Math.floor((Date.now() - (p.criadoEm || Date.now())) / 86400000);
    return dias > 30 ? { p, dias, last, m } : null;
  }).filter(Boolean).sort((a, b) => b.dias - a.dias);
  let tl = "";
  if (!events.length) tl = `<div class="empty"><div class="empty-art">📅</div><h3>Nenhum registro ainda</h3><p>Quando fizerem ou pedirem um prato, abram o prato e toquem em “Fizemos hoje”.</p></div>`;
  else {
    let lastDay = "";
    events.slice(0, S.histLimit).forEach(ev => {
      if (ev.d !== lastDay) { tl += `<div class="tl-day">${esc(dayLabel(ev.d))}</div>`; lastDay = ev.d; }
      const casa = ev.p.origem !== "restaurante";
      tl += tlRow(ev.p, `${casa ? "Feito em casa" : "Pedido" + (ev.p.restaurante ? " do " + ev.p.restaurante : "")} · registrado por ${memberName(ev.por)}`);
    });
    if (events.length > S.histLimit) tl += `<div class="pad" style="padding-top:10px"><button class="btn btn-ghost btn-lg" data-act="hist-more">Mostrar mais</button></div>`;
  }
  return topbar("Histórico") + `
    <h2 class="sec-title">Mais feitos</h2>
    <div class="seg-pill" role="group" aria-label="Período do ranking"><button data-act="hist-range" data-v="90" aria-pressed="${S.histRange === "90"}">Últimos 90 dias</button><button data-act="hist-range" data-v="all" aria-pressed="${S.histRange === "all"}">Desde sempre</button></div>
    ${counts.length ? counts.map((x, i) => tlRow(x.p, lastTxt(x.p), `<span class="rk-n">${x.n}×</span>`, `<span class="rk-pos">${i + 1}</span>`)).join("") : `<p class="pad muted" style="padding-top:6px;padding-bottom:6px">${S.histRange === "90" ? "Nenhum registro nos últimos 90 dias." : "Ainda não há registros."}</p>`}
    <h2 class="sec-title">Faz tempo que não fazemos</h2>
    <p class="sec-sub">Pratos com 4 estrelas ou mais e sem registro há mais de 30 dias.</p>
    ${saudade.length ? saudade.map(x => tlRow(x.p, x.last ? `última vez há ${x.dias} dias` : `sem registro desde o cadastro, há ${x.dias} dias`, `<span class="cover-rate">${ic("star", 14)} ${fmt1(x.m)}</span>`)).join("") : `<p class="pad muted" style="padding-top:6px">Nenhum por enquanto. Os favoritos estão em dia!</p>`}
    <h2 class="sec-title">Linha do tempo</h2>
    ${tl}`;
}

document.addEventListener("submit", e => {

    const v = $("#onbName").value.trim().replace(/\s+/g, " ");
