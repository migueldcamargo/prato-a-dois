document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.act) {
    case "reload": location.reload(); break;
    case "home": closeAllSheets(); goHome(); break;
    case "refresh": refreshNow(true); break;
    case "retry": refreshNow(true); break;
    case "tab": {
      if (S.tab === "cardapio") S.cardScroll = window.scrollY;
      const mudou = S.tab !== d.tab;
      S.tab = d.tab;
      renderCardScreen(true);
      window.scrollTo(0, S.tab === "cardapio" && mudou ? S.cardScroll : 0);
      if (mudou) refreshNow(false);
      break;
    }
    case "tabcat": scrollToCat(d.cat); break;
    case "add": openForm(null); break;
    case "open": openCardapio(d.code); break;
    case "create": openCreate(); break;
    case "join": openJoin(); break;
    case "rename-me": renameMe(); break;
    case "sair": sair(); break;
    case "tutorial": openTutorial(); break;
    case "dish": openDetail(d.id); break;
    case "newcat": newCategoryFlow(); break;
    case "goto-config": S.tab = "config"; renderCardScreen(true); window.scrollTo(0, 0); break;
    case "request-edit": requestEdit(); break;
    case "papel": acaoPapel(d.acao, d.mid); break;
    case "rename-card": renameCard(); break;
    case "copy-code": copyText(S.cur, `Código ${S.cur} copiado`); break;
    case "share-code": shareCode(S.cur); break;
    case "cat-edit": editCategory(d.cid); break;
    case "cat-del": deleteCategory(d.cid); break;
    case "classify": openClassify(); break;
    case "filt": setFiltro(d.k, d.v); break;
    case "filt-mais": S.filtrosAbertos = !S.filtrosAbertos; renderCardScreen(false); break;
    case "filt-limpar": S.filtros = Object.assign({}, L.FILTROS_VAZIOS); LS.set("pd:filtros", JSON.stringify(S.filtros)); renderCardScreen(false); break;
    case "jogo-categorias": openDueloCategorias(); break;
    case "jogo-iou": openIssoOuAquilo(poolAtual().map(x => x.prato.id)); break;
    case "sortear": sortearDe(poolAtual().map(x => x.prato.id)); break;
    case "hist-range": S.histRange = d.v; renderCardScreen(false); break;
    case "hist-more": S.histLimit += 30; renderCardScreen(false); break;
    case "rate": ratePrato(d.id, Number(d.n)); break;
    case "done": markDone(d.id, el); break;
    case "edit": openForm(d.id); break;
    case "del": deletePrato(d.id); break;
    case "import": openImport(d.id); break;
    case "close-sheet": closeSheet(); break;
  }
});

/* ---------- Entrar / criar / sair ---------- */
function codeBoxes(code) { return `<div class="code-big" aria-label="Código ${esc(code)}">${code.split("").map(ch => `<span>${esc(ch)}</span>`).join("")}</div>`; }
function openJoin() {
  const s = openSheet({ html: `
    <div class="sheet-head"><h3>Entrar com código</h3><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close")}</button></div>
    <form class="sheet-body" id="joinForm" style="display:flex;flex-direction:column;gap:12px">
      <p class="muted">Digite o código de 5 caracteres que te mandaram.</p>
      <label class="vh" for="joinCode">Código do cardápio</label>
      <input id="joinCode" class="inp inp-code" maxlength="8" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="•••••">
      <p class="hint" id="joinHint">Letras e números, sem 0, O, 1, I e L.</p>
      <button class="btn btn-red btn-lg" id="joinBtn" type="submit" disabled>Entrar</button>
    </form>` });
  const inp = $("#joinCode", s.el), btn = $("#joinBtn", s.el), hint = $("#joinHint", s.el);
  setTimeout(() => inp.focus(), 280);
  s.el.querySelector('[data-x="close"]').onclick = () => closeSheet(s);
  inp.addEventListener("input", () => {
    const raw = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    const ok = raw.split("").filter(ch => CODE_CHARS.includes(ch));
    if (ok.length !== raw.length) { hint.textContent = "Os códigos não usam 0, O, 1, I nem L. Confira o código."; hint.style.color = "var(--red)"; }
    else { hint.textContent = "Letras e números, sem 0, O, 1, I e L."; hint.style.color = ""; }
    inp.value = ok.join("").slice(0, 5);
    btn.disabled = inp.value.length !== 5;
  });
  $("#joinForm", s.el).addEventListener("submit", async e => {
    e.preventDefault();
    const code = inp.value;
    if (!/^[A-Z0-9]{5}$/.test(code)) return;
    btn.disabled = true; btn.textContent = "Procurando…";
    let r;
    try { r = await q2(() => sb.rpc("entrar_cardapio", { p_codigo: code, p_meu_nome: S.nome })); }
    catch (err) { hint.textContent = errMsg(err); hint.style.color = "var(--red)"; btn.disabled = false; btn.textContent = "Entrar"; return; }
    if (!r) { hint.textContent = `Não achei nenhum cardápio com o código ${code}. Confere com quem te mandou?`; hint.style.color = "var(--red)"; btn.disabled = false; btn.textContent = "Entrar"; return; }
    setMeu(code, { nome: r.nome, papel: r.papel }, true);
    s.onClose = null; closeSheet(s); openCardapio(code);
  });
}
function openCreate() {
  const s = openSheet({ html: `
    <div class="sheet-head"><h3>Criar cardápio novo</h3><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close")}</button></div>
    <div class="sheet-body" id="crBody">
      <form id="crForm" style="display:flex;flex-direction:column;gap:12px">
        <label class="lbl" for="crName">Nome do cardápio</label>
        <input id="crName" class="inp" maxlength="40" placeholder="Ex.: Nosso cantinho" autocomplete="off">
        <p class="hint">Se deixar em branco, fica “Cardápio de ${esc(S.nome)}”.</p>
        <p class="err" id="crErr"></p>
        <button class="btn btn-red btn-lg" type="submit" id="crBtn">Criar cardápio</button>
      </form>
    </div>` });
  s.el.addEventListener("click", e => { if (e.target.closest('[data-x="close"]')) closeSheet(s); });
  setTimeout(() => { const i = $("#crName", s.el); if (i) i.focus(); }, 280);
  $("#crForm", s.el).addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#crBtn", s.el);
    const nome = ($("#crName", s.el).value.trim() || `Cardápio de ${S.nome}`).slice(0, 40);
    btn.disabled = true; btn.textContent = "Criando…";
    try {
      const code = await q(sb.rpc("criar_cardapio", { p_nome: nome, p_meu_nome: S.nome }));
      setMeu(code, { nome, papel: "dono", pend: 0 }, true);
      $("#crBody", s.el).innerHTML = `<div class="created">
        <div class="ok-ic">${ic("check", 30)}</div>
        <h3>Cardápio criado!</h3>
        <p class="muted">Mande este código para seu par entrar:</p>
        ${codeBoxes(code)}
        <div class="row2"><button class="btn btn-ghost" data-x="copy">${ic("copy", 18)} Copiar</button><button class="btn btn-red" data-x="share">${ic("share", 18)} Compartilhar</button></div>
        <a class="wa-link" href="${esc(waHref(code))}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
        <button class="btn btn-soft btn-lg" data-x="open">Abrir cardápio</button>
      </div>`;
      s.onClose = () => openCardapio(code);
      $("#crBody", s.el).addEventListener("click", ev => {
        const b = ev.target.closest("[data-x]"); if (!b) return;
        if (b.dataset.x === "copy") copyText(code, `Código ${code} copiado`);

      });

      console.warn(err);
      $("#crErr", s.el).textContent = errMsg(err);
      btn.disabled = false; btn.textContent = "Criar cardápio";
    }
  });

async function renameMe() {
  const r = await textSheet({ title: "Seu nome", label: "Como você quer aparecer para o seu par?", value: S.nome, max: 30 });
  if (!r || !r.value) return;
  S.nome = r.value.replace(/\s+/g, " ").slice(0, 30);
  LS.set("pd:nome", S.nome);
  await act(() => q(sb.rpc("renomear_me", { p_nome: S.nome })));
  for (const [k, m] of T.membros) if (m.user_id === S.uid) T.membros.set(k, Object.assign({}, m, { nome: S.nome }));
  toast("Nome atualizado");
  if (S.screen === "home") render(); else changed();
}
/* Sair: apaga a sessão e os dados deste aparelho. Não dá para voltar a ser a mesma pessoa (não há login). */
async function sair() {
  const donoDe = Object.values(S.meus).filter(m => m.papel === "dono").length;
  const aviso = donoDe ? ` Você é dono de ${donoDe === 1 ? "um cardápio" : donoDe + " cardápios"}: antes de sair, torne seu par dono também (Configurações → Pessoas), senão ninguém mais aprova pedidos.` : "";
  const ok = await confirmDlg({ title: `Sair do ${APP_NAME}?`, text: "Este celular perde o acesso aos seus cardápios. Para voltar, entre de novo com o código e peça para editar." + aviso, ok: "Sair", danger: true });
  if (!ok) return;
  unsubscribe();
  try { await sb.auth.signOut({ scope: "local" }); } catch (e) {}
  ["pd:nome", "pd:meus", "pd:ultimo", "pd:filtros", "pd-auth"].forEach(k => LS.del(k));

/* ---------- Categorias ---------- */
async function createCategory(nome, icone) {
  nome = (nome || "").trim().replace(/\s+/g, " ").slice(0, 24);
  if (!nome) return null;
  const code = S.cur;
  try {
    const rows = await q2(() => sb.from("categorias").select("*").eq("cardapio", code));
    rows.forEach(r => put("categorias", r));
    const found = rows.find(r => norm(r.nome) === norm(nome));
    if (found) { changed(); return found.id; }
    const ordem = Math.max(0, ...rows.map(r => r.ordem || 0)) + 1;
    try {
      const r = await q(sb.from("categorias").insert({ cardapio: code, nome, icone: icone || "🍴", ordem }).select().single());
      put("categorias", r); changed(); return r.id;
    } catch (e) {
      if (e && e.code === "23505") {
        const again = await q2(() => sb.from("categorias").select("*").eq("cardapio", code));
        again.forEach(r => put("categorias", r)); changed();
        const f = again.find(r => norm(r.nome) === norm(nome));
        return f ? f.id : null;
      }
      throw e;
    }
  } catch (e) { console.warn(e); toast(errMsg(e)); return null; }
}

/* ---------- Cadastro / edição ---------- */
function resizeImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const max = 400, w = img.naturalWidth, h = img.naturalHeight;
        const k = Math.min(1, max / Math.max(w, h));
        const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
        const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
        const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cw, ch); cx.drawImage(img, 0, 0, cw, ch);
        res(cv.toDataURL("image/jpeg", 0.6));
      } catch (e) { rej(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

    const validCats = Array.from(F.cats).filter(c => S.card && S.card.categorias && S.card.categorias[c]);
    if (!validCats.length) { $("#eCats", el).textContent = "Escolha pelo menos uma categoria."; bad = bad || "#fCats"; }
    if (bad) { const t = $(bad, el); if (t) t.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    const ordered = catsSorted().map(c => c.id).filter(c => validCats.includes(c));
    const restaurante = F.origem === "restaurante" ? $("#fRest", el).value.trim().replace(/\s+/g, " ").slice(0, 50) : "";
    const fields = { nome: nome.slice(0, 60), origem: F.origem, restaurante, categorias: ordered };
    ATTRS.forEach(a => { fields[a.key] = F.quiz[a.key] || null; });
    const btn = $('[data-x="save"]', el);
    F.saving = true; btn.disabled = true; btn.textContent = "Salvando…";
    const code = S.cur;
    let ok = false, pid = F.id;
    try {
      if (!F.id) {
        pid = uuid();
        const row = await q(sb.from("pratos").insert(Object.assign({ id: pid, cardapio: code, criado_por: S.uid }, fields)).select().single());
        put("pratos", row);
        ok = true;
        try {
          if (F.foto) await salvarFoto(pid, code, F.foto);
          if (F.nota) await salvarNota(pid, code, F.nota);
        } catch (e2) { console.warn(e2); toast("Prato salvo, mas a foto ou a nota não foram gravadas. Tente editar de novo."); }
        changed();
        toast(`${fields.nome} cadastrado!`, { action: "Ver", onAction: () => openDetail(pid) });
      } else {
        const rows = await q(sb.from("pratos").update(Object.assign({ atualizado_em: nowISO() }, fields)).eq("id", F.id).select());
        if (!rows.length) {
          const ex = await q(sb.from("pratos").select("id").eq("id", F.id));
          toast(ex.length ? "Você não tem permissão para editar este prato." : "Esse prato foi excluído por outra pessoa enquanto você editava.");
          if (!ex.length) { s.onClose = null; closeSheet(s); }
          F.saving = false; btn.disabled = false; btn.textContent = "Salvar alterações";
          return;
        }
        put("pratos", rows[0]);
        if (F.foto !== foto0) {
          if (F.foto) await salvarFoto(F.id, code, F.foto);
          else { await q(sb.from("fotos").delete().eq("prato_id", F.id)); T.fotos.delete(F.id); }
        }
        if (F.nota !== myN) await salvarNota(F.id, code, F.nota);
        ok = true;
        changed();
        toast("Alterações salvas");
      }
    } catch (e) { console.warn(e); toast(errMsg(e)); }
    F.saving = false;
    if (ok) { s.onClose = null; closeSheet(s); }
    else { btn.disabled = false; btn.textContent = F.id ? "Salvar alterações" : "Salvar prato"; }
  };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-x]"); if (!b || b.disabled) return;
    const x = b.dataset.x;
    if (x === "close") closeSheet(s);
    else if (x === "orig") { F.origem = b.dataset.v; paintOrig(); $("#eOrig", el).textContent = ""; if (F.origem === "restaurante") { paintSugs(); setTimeout(() => $("#fRest", el).focus(), 50); } }
    else if (x === "sug") { $("#fRest", el).value = b.dataset.v; paintSugs(); }
    else if (x === "cat") { const c = b.dataset.id; if (F.cats.has(c)) F.cats.delete(c); else F.cats.add(c); b.setAttribute("aria-pressed", String(F.cats.has(c))); $("#eCats", el).textContent = ""; }
    else if (x === "newCat") { F.newCat = true; paintCats(); }
    else if (x === "newCatOk") addNewCat();
    else if (x === "rmFoto") { F.foto = null; paintFoto(false); }
    else if (x === "nota") { const n = Number(b.dataset.n); F.nota = F.nota === n ? null : n; paintNota(); }
    else if (x === "quizToggle") { const qz = $("#fQuiz", el); qz.hidden = !qz.hidden; b.setAttribute("aria-expanded", String(!qz.hidden)); if (!qz.hidden) setTimeout(() => qz.scrollIntoView({ block: "nearest", behavior: "smooth" }), 30); }
    else if (x === "qa") { const k = b.dataset.attr, v = b.dataset.v; F.quiz[k] = F.quiz[k] === v ? null : v; paintQuiz(); }
    else if (x === "save") save();
  });
}

/* ---------- Importar ---------- */
async function openImport(id) {
  const p0 = S.pratos[id]; if (!p0) return;
  const p = Object.assign({ id }, p0);
  const srcCats = Object.assign({}, (S.card && S.card.categorias) || {});
  const srcCode = S.cur;
  const s = openSheet({ html: `<div class="sheet-head"><h3>Importar ${esc(p.nome)}</h3><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close")}</button></div><div class="sheet-body" id="impBody"><div class="center-screen" style="min-height:120px"><div class="loader"></div></div></div>` });
  s.el.addEventListener("click", e => { if (e.target.closest('[data-x="close"]')) closeSheet(s); });
  const body = $("#impBody", s.el);
  await refreshMeus();
  if (!sheetStack.includes(s)) return;
  const rows = Object.entries(S.meus).filter(([c, m]) => c !== srcCode && L.podeEditar(m.papel))
    .map(([c, m]) => ({ c, nome: m.nome || c, pap: m.papel })).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  if (!rows.length) {
    body.innerHTML = `<div class="empty" style="padding:16px 8px"><div class="empty-art">📥</div><h3>Nenhum cardápio seu</h3><p>Você ainda não é dono nem editor de outro cardápio. Crie o seu e volte aqui para importar.</p><button class="btn btn-red" data-x="mk">Criar meu cardápio</button></div>`;
    $('[data-x="mk"]', body).onclick = () => { closeAllSheets(); goHome(); setTimeout(openCreate, 120); };
    return;
  }
  body.innerHTML = `<p class="muted" style="margin-bottom:8px">Vai junto: nome, origem, restaurante, categorias, foto e respostas dos filtros. Notas e histórico ficam.</p>` +
    rows.map(r => `<button class="myitem" data-x="to" data-code="${esc(r.c)}"><span class="my-logo">${esc((r.nome || "?").charAt(0).toUpperCase())}</span><span class="my-info"><b>${esc(r.nome)}</b><small>${esc(r.c)}</small></span><span class="role role-${esc(r.pap)}">${esc(ROLE_LABEL[r.pap])}</span></button>`).join("");
  body.addEventListener("click", async e => {
    const b = e.target.closest('[data-x="to"]'); if (!b || b.disabled) return;
    $$('[data-x="to"]', body).forEach(x => { x.disabled = true; });
    const dest = b.dataset.code;
    const ok = await doImport(p, srcCats, dest);
    if (ok) { s.onClose = null; closeSheet(s); toast(`${p.nome} importado para ${(S.meus[dest] || {}).nome || dest}`); }
    else $$('[data-x="to"]', body).forEach(x => { x.disabled = false; });
  });
}
async function doImport(p, srcCats, dest) {
  try {
    let dcats = await q2(() => sb.from("categorias").select("*").eq("cardapio", dest));
    const nomes = [];
    (p.categorias || []).forEach(cid => { const sc = srcCats[cid]; if (sc && sc.nome && !nomes.some(n => norm(n.nome) === norm(sc.nome))) nomes.push(sc); });
    const faltam = nomes.filter(sc => !dcats.some(d => norm(d.nome) === norm(sc.nome)));
    if (faltam.length) {
      let ordem = Math.max(0, ...dcats.map(d => d.ordem || 0)) + 1;
      try { await q(sb.from("categorias").insert(faltam.map(sc => ({ cardapio: dest, nome: sc.nome, icone: sc.icone || "🍴", ordem: ordem++ })))); }
      catch (e) { if (!e || e.code !== "23505") throw e; }
      dcats = await q2(() => sb.from("categorias").select("*").eq("cardapio", dest));
    }
    const ids = nomes.map(sc => (dcats.find(d => norm(d.nome) === norm(sc.nome)) || {}).id).filter(Boolean);
    const pid = uuid();
    const row = { id: pid, cardapio: dest, nome: p.nome, origem: p.origem === "restaurante" ? "restaurante" : "casa", restaurante: p.restaurante || "", categorias: ids, criado_por: S.uid };
    ATTRS.forEach(a => { row[a.key] = (p.quiz && p.quiz[a.key]) || null; });
    await q(sb.from("pratos").insert(row));
    if (validFoto(p.foto)) await salvarFoto(pid, dest, p.foto);
    return true;
  } catch (e) { console.warn(e); toast(errMsg(e)); return false; }
}

/* ---------- Classificação rápida (arrastar estilo Tinder) ----------
 * Fases: "pergunta" (escolher qual atributo) → "classificando" → "fim".
 * Esquerda = 1ª opção, direita = 2ª, botão do meio = os dois. Cada gesto grava na hora; "Desfazer último" restaura o valor anterior. */
let swQ = Promise.resolve();
const enqueue = fn => (swQ = swQ.then(fn).catch(e => console.warn(e)));
function openClassify() {
  if (!canEdit()) return;
  const C = { fase: "pergunta", attr: null, all: false, queue: [], i: 0, undo: [], busy: false };
  const s = openSheet({ cls: "full", html: `<div class="sw" id="sw"></div>`, onClose: () => { S.cls = null; } });
  S.cls = C;
  const el = s.el;
  const A = () => ATTRS.find(a => a.key === C.attr);
  const saveAttr = (id, attr, val) => enqueue(async () => {
    try { if (!(await setQuizAttr(id, attr, val))) toast("Esse prato foi excluído ou você não pode editá-lo."); }
    catch (e) { toast(errMsg(e)); }
  });
  const paint = enter => {
    C.fase = C.attr == null ? "pergunta" : (C.i >= C.queue.length ? "fim" : "classificando");
    if (C.fase === "pergunta") return paintPick();
    return paintRun(enter);
  };
  const paintPick = () => {
    const ps = pratosArr();
    $("#sw", el).innerHTML = `<div class="sw-top"><span style="width:44px"></span><div class="sw-q">Classificar pratos</div><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close", 22)}</button></div>
      <div class="sw-pick"><p>Escolha uma pergunta. Depois é só arrastar cada prato para o lado da resposta, ou tocar em “Os dois”.</p>
      ${ATTRS.map(a => { const falta = ps.filter(p => !(p.quiz && p.quiz[a.key])).length; return `<button class="pick-q" data-x="start" data-attr="${a.key}"><span><b>${esc(a.q)}</b><small>${falta ? plural(falta, "prato sem resposta", "pratos sem resposta") : "todos respondidos"}</small></span>${ic("chevR", 20)}</button>`; }).join("")}
      <label class="toggle"><input type="checkbox" id="swAll" ${C.all ? "checked" : ""}> Revisar todos (inclui os já respondidos)</label>
      ${ps.length ? "" : `<p class="muted">Cadastre alguns pratos primeiro.</p>`}</div>`;
    $("#swAll", el).addEventListener("change", ev => { C.all = ev.target.checked; });
  };
  const start = attr => {
    C.attr = attr; C.i = 0; C.undo = [];
    C.queue = pratosArr().filter(p => C.all || !(p.quiz && p.quiz[attr])).sort(byName).map(p => p.id);
    paint();
  };
  const cardHTML = (id, cls) => {
    const p0 = S.pratos[id];
    if (!p0) return `<div class="sw-card ${cls}" data-id="${esc(id)}"><div class="sw-photo"><span class="ph">🗑️</span></div><div class="sw-info"><b>Prato excluído</b><span class="muted">Pule este.</span></div></div>`;
    const p = Object.assign({ id }, p0);
    const cats = (S.card && S.card.categorias) || {};
    const cur = p.quiz && p.quiz[C.attr];
    return `<div class="sw-card ${cls}" data-id="${esc(id)}">
      <div class="sw-photo">${validFoto(p.foto) ? `<img src="${p.foto}" alt="" draggable="false">` : `<span class="ph" aria-hidden="true">${esc(catIcon(p))}</span>`}</div>
      <div class="sw-info"><b>${esc(p.nome)}</b><div class="chips">${(p.categorias || []).filter(c => cats[c]).map(c => `<span class="chip chip-static">${esc(cats[c].nome)}</span>`).join("")}${cur ? `<span class="chip chip-quiz">Hoje: ${esc(ATTR_LABEL[C.attr + ":" + cur] || cur)}</span>` : ""}</div></div>
    </div>`;
  };
  const paintRun = enter => {
    const a = A(); const n = C.queue.length;
    const top = `<div class="sw-top"><button class="icon-btn" data-x="pick" aria-label="Outra pergunta">${ic("chevL", 22)}</button><div class="sw-q">${esc(a.q)}</div><button class="icon-btn" data-x="close" aria-label="Fechar">${ic("close", 22)}</button></div>`;
    if (C.fase === "fim") {
      $("#sw", el).innerHTML = top + `<div class="sw-prog"><span>${n} de ${n}</span><div class="prog"><i style="width:100%"></i></div></div>
        <div class="empty" style="flex:1;justify-content:center"><div class="empty-art">🎉</div><h3>${n ? "Pronto!" : "Nada para classificar"}</h3><p>${n ? `Todos os pratos da lista têm resposta para “${esc(a.q)}”.` : `Todos os pratos já têm resposta para essa pergunta. Marque “Revisar todos” para mudar alguma.`}</p>
        <button class="btn btn-red" data-x="pick">Escolher outra pergunta</button><button class="btn btn-text" data-x="close">Voltar</button></div>
        <div class="sw-sub" style="justify-content:center"><button class="btn btn-text" data-x="undo" ${C.undo.length ? "" : "disabled"}>${ic("undo", 18)} Desfazer último</button></div>`;
      return;
    }
    $("#sw", el).innerHTML = top + `<div class="sw-prog"><span>${C.i + 1} de ${n}</span><div class="prog"><i style="width:${C.i / n * 100}%"></i></div></div>
      <div class="sw-stage"><div class="sw-side l" id="sideA">← ${esc(a.a[1])}</div><div class="sw-side r" id="sideB">${esc(a.b[1])} →</div>
        <div class="sw-stack">${C.i + 1 < n ? cardHTML(C.queue[C.i + 1], "back") : ""}${cardHTML(C.queue[C.i], "front")}</div></div>
      <div class="sw-btns"><button class="btn btn-a" data-x="A">${esc(a.a[1])}</button><button class="btn btn-ab" data-x="AB" ${bancoAceitaAmbos() ? "" : "disabled"}>${esc(a.ambos[1])}</button><button class="btn btn-b" data-x="B">${esc(a.b[1])}</button></div>
      <div class="sw-sub"><button class="btn btn-text" data-x="undo" ${C.undo.length ? "" : "disabled"}>${ic("undo", 18)} Desfazer último</button><button class="btn btn-text" data-x="skip" style="color:var(--muted)">Pular</button></div>`;
    const card = $(".sw-card.front", el);
    if (enter && !reduceMotion()) {
      card.style.transition = "none";
      card.style.transform = enter === "a" ? "translateX(-130%) rotate(-18deg)" : enter === "b" ? "translateX(130%) rotate(18deg)" : "translateY(-40%)";
      card.style.opacity = enter === "a" || enter === "b" ? "1" : "0";
      requestAnimationFrame(() => requestAnimationFrame(() => { card.style.transition = "transform .25s ease-out, opacity .25s"; card.style.transform = ""; card.style.opacity = "1"; }));
    }
    bindDrag(card);
  };
  const tint = (card, dx) => {
    const ta = dx < 0 ? Math.min(1, -dx / 120) : 0, tb = dx > 0 ? Math.min(1, dx / 120) : 0;
    card.style.setProperty("--ta", ta); card.style.setProperty("--tb", tb);
    const sa = $("#sideA", el), sbx = $("#sideB", el);
    if (sa) sa.classList.toggle("hot", ta > .5);
    if (sbx) sbx.classList.toggle("hot", tb > .5);
  };
  const bindDrag = card => {
    let sx = 0, sy = 0, dx = 0, dy = 0, drag = false, pid = null;
    card.addEventListener("pointerdown", e => {
      if (C.busy || (e.button != null && e.button > 0)) return;
      drag = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0;
      try { card.setPointerCapture(pid); } catch (x) {}
      card.style.transition = "none"; card.style.cursor = "grabbing";
    });
    card.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== pid) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      card.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx / 14}deg)`;
      tint(card, dx);
    });
    const end = e => {
      if (!drag || e.pointerId !== pid) return;
      drag = false; card.style.cursor = "";
      const th = Math.min(110, card.offsetWidth * 0.3);
      if (Math.abs(dx) > th) commit(dx < 0 ? "a" : "b");
      else { card.style.transition = "transform .2s ease-out"; card.style.transform = ""; tint(card, 0); }
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
    card.addEventListener("lostpointercapture", end);
  };
  /* choice: "a" | "b" | "ab" (os dois) | "skip" */
  const commit = async choice => {
    if (C.busy || C.fase !== "classificando") return;
    C.busy = true;
    const a = A(); const id = C.queue[C.i];
    const card = $(".sw-card.front", el);
    if (choice === "skip") C.undo.push({ id, kind: "skip" });
    else {
      const val = choice === "a" ? a.a[0] : choice === "b" ? a.b[0] : L.AMBOS;
      const prev = (S.pratos[id] && S.pratos[id].quiz && S.pratos[id].quiz[a.key]) || null;
      C.undo.push({ id, kind: "set", prev, side: choice });
      if (S.pratos[id]) saveAttr(id, a.key, val);
    }
    if (card && !reduceMotion()) {
      card.style.transition = "transform .24s ease-in, opacity .24s";
      card.style.transform = choice === "a" ? "translateX(-140%) rotate(-22deg)" : choice === "b" ? "translateX(140%) rotate(22deg)" : "translateY(-40%) scale(.9)";
      if (choice === "skip" || choice === "ab") card.style.opacity = "0";
      tint(card, choice === "a" ? -200 : choice === "b" ? 200 : 0);
      await sleep(230);
    }
    C.i++; C.busy = false;
    paint();
  };
  const undo = () => {
    if (C.busy) return;
    const u = C.undo.pop(); if (!u) return;
    if (u.kind === "set" && S.pratos[u.id]) saveAttr(u.id, C.attr, u.prev);
    C.i = Math.max(0, C.i - 1);
    paint(u.kind === "set" ? u.side : "skip");
    toast("Voltei o último prato");
  };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-x]"); if (!b || b.disabled) return;
    const x = b.dataset.x;
    if (x === "close") closeSheet(s);
    else if (x === "pick") { C.attr = null; paint(); }
    else if (x === "start") start(b.dataset.attr);
    else if (x === "A") commit("a");
    else if (x === "B") commit("b");
    else if (x === "AB") commit("ab");
    else if (x === "skip") commit("skip");
    else if (x === "undo") undo();
  });
  paint();
}

Object.defineProperty(window, "__prato", { value: Object.freeze({ S, T, Logica: L, versao: APP_VERSAO }) });

boot();
